name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v

  build:
    name: lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh tests/fakebin/_shim.sh

      - name: Committed single file matches the sources
        run: |
          set -euo pipefail
          DIST_DIR=dist scripts/build-dist.sh
          cmp dist/gfv-accept.sh gfv-accept.sh || {
            echo "::error file=gfv-accept.sh::stale: run scripts/build-dist.sh and commit gfv-accept.sh"
            exit 1
          }

      - name: Check the single file
        run: |
          set -euo pipefail
          shellcheck gfv-accept.sh
          bash gfv-accept.sh version
          bash gfv-accept.sh accept --class hgx-h100-8x --dry-run
          bash -s -- accept --class hgx-h100-8x --dry-run < gfv-accept.sh

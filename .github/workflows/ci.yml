name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v

  build:
    name: lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The last one is the default python3 (it builds); the release assets are also run on 3.10.
          python-version: |
            3.10
            3.12

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh tests/fakebin/_shim.sh gfv-accept.sh

      - name: Build the release assets
        run: scripts/build-dist.sh

      - name: Build is reproducible
        run: |
          set -euo pipefail
          DIST_DIR=dist2 scripts/build-dist.sh
          for f in gfv.pyz gfv.sh SHA256SUMS; do cmp "dist/$f" "dist2/$f"; done

      - name: Check the release assets on every Python
        env:
          CHECK_PYTHONS: "3.10 3.12"
        run: scripts/check-dist.sh dist
